server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/back_end1
    username: postgres
    password: postgres

  quartz:
    jdbc:
      initialize-schema: always

  jpa:
    hibernate:
      # Змінюємо на update, щоб уникнути помилок валідації при першому запуску, або залишаємо validate, якщо Liquibase налаштований вірно
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Управління міграціями бази даних через Liquibase (Вимога Лаб №1, AC2)
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Налаштування подвійної автентифікації: OIDC (для UI/браузера) та JWT (для API/Postman)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/master
      client:
        registration:
          keycloak:
            client-id: back-end1-client
            client-secret: secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/master/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/master/protocol/openid-connect/token
            user-info-uri: http://localhost:8080/realms/master/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
            jwk-set-uri: http://localhost:8080/realms/master/protocol/openid-connect/certs
    # Додано для запобігання збоїв при відсутності Keycloak під час запуску
    check-token-endpoint:
      enabled: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

lab11:
  batch:
    chunk-size: 5
    skip-limit: 10
    input-dir: C:/lab11_imports
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
lab9:
  transport: ${LAB9_TRANSPORT:http}
  rest:
    base-url: ${LAB9_REST_BASE_URL:http://localhost:8082}
    connect-timeout: ${LAB9_REST_CONNECT_TIMEOUT:1000ms}
    read-timeout: ${LAB9_REST_READ_TIMEOUT:2000ms}
  grpc:
    host: ${LAB9_GRPC_HOST:localhost}
    port: ${LAB9_GRPC_PORT:9092}
    deadline: ${LAB9_GRPC_DEADLINE:2000ms}
resilience4j:
  retry:
    instances:
      partLookupRetry:
        max-attempts: ${LAB10_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${LAB10_RETRY_WAIT_DURATION:300ms}
        retry-exceptions:
          - org.example.back_end1.lookup.LookupServiceUnavailableException
        ignore-exceptions:
          - org.example.back_end1.lookup.PartNotFoundException
  circuitbreaker:
    instances:
      partLookupCircuitBreaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${LAB10_CB_WINDOW_SIZE:6}
        minimum-number-of-calls: ${LAB10_CB_MIN_CALLS:3}
        failure-rate-threshold: ${LAB10_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${LAB10_CB_OPEN_WAIT:5s}
        permitted-number-of-calls-in-half-open-state: ${LAB10_CB_HALF_OPEN_CALLS:2}
        record-exceptions:
          - org.example.back_end1.lookup.LookupServiceUnavailableException
        ignore-exceptions:
          - org.example.back_end1.lookup.PartNotFoundException

lab10:
  shedlock:
    enabled: ${LAB10_SCHEDLOCK_ENABLED:true}
    cron: ${LAB10_SCHEDLOCK_CRON:*/15 * * * * *}
    lock-at-most-for: ${LAB10_SCHEDLOCK_AT_MOST_FOR:25s}
    lock-at-least-for: ${LAB10_SCHEDLOCK_AT_LEAST_FOR:5s}
lab12:
  reporting:
    font-classpath: classpath:fonts/DejaVuSans.ttf
    zone-id: Europe/Kyiv
    vat-rate: 0.20
    max-admin-pdf-rows: 100
    csv-page-size: 500
    storage-dir: C:/lab12_exports